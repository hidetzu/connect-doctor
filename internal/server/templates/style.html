{{/* The one stylesheet, shared by every page. ⚠ Two copies of the CSS would drift. */}}
{{define "style"}}<style>
/* hidetzu/connect-doctor#25, candidate A: a headline card, then the four steps in one row.
   ⚠ Colour encodes STATE (ok / warn / fail / neutral), never a layer. */
:root { --fg:#1b1f24; --muted:#59636e; --faint:#c8d1da; --line:#d1d9e0; --bg:#fff; --panel:#f6f8fa; --accent:#0969da;
  --ok:#1a7f37; --ok-bg:#dafbe1; --warn:#9a6700; --warn-bg:#fff8c5; --fail:#cf222e; --fail-bg:#ffebe9; --neutral:#59636e; --neutral-bg:#eff2f5;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace; }
@media (prefers-color-scheme: dark) {
  :root { --fg:#e6edf3; --muted:#9198a1; --faint:#3d444d; --line:#3d444d; --bg:#0d1117; --panel:#151b23; --accent:#4493f8;
    --ok:#3fb950; --ok-bg:#12261e; --warn:#d29922; --warn-bg:#272115; --fail:#f85149; --fail-bg:#2d1517; --neutral:#9198a1; --neutral-bg:#1c2128; color-scheme:dark; }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.6 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; }
main { max-width:40rem; margin:0 auto; padding:1.25rem 1rem 3rem; }
a { color:var(--accent); }
code { font-family:var(--mono); font-size:.9em; }
.top { display:flex; flex-wrap:wrap; gap:.5rem 1rem; align-items:center; justify-content:space-between; margin-bottom:1rem; }
.brand { display:inline-flex; align-items:center; gap:.55rem; font-weight:700; font-size:1.15rem; letter-spacing:.01em; }
.brand { color:inherit; text-decoration:none; } .brand > span { display:inline-flex; } .brand svg { width:28px; height:28px; flex:none; display:block; }
.lede { margin:-.4rem 0 1rem; color:var(--muted); font-size:.9rem; }
.foot { margin-top:2.5rem; padding-top:1rem; border-top:1px solid var(--line); color:var(--muted); font-size:.8rem; display:grid; gap:.3rem; }
.foot p { margin:0; }
.chip { display:inline-flex; flex-direction:column; padding:.3rem .65rem; border:1px solid var(--line); border-radius:999px; font-size:.78rem; line-height:1.3; background:var(--panel); }
.chip b { font-weight:600; } .chip b::before { content:"◉ "; color:var(--accent); } .chip small { color:var(--muted); }
form { display:flex; gap:.5rem; }
input { flex:1; min-width:0; padding:.6rem .75rem; font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:6px; }
button { padding:.6rem 1rem; font:inherit; color:#fff; background:var(--accent); border:0; border-radius:6px; cursor:pointer; }
.strip { display:flex; align-items:center; gap:.4rem; margin:.6rem 0 0; color:var(--muted); font:500 .72rem var(--mono); letter-spacing:.04em; }
.strip i { flex:1; height:1px; background:var(--faint); } .strip span::before { content:"●"; margin-right:.25rem; color:var(--faint); }
.verdict { margin:1.5rem 0 .6rem; padding:1rem 1.1rem; border-radius:10px; border:1px solid var(--line); background:var(--neutral-bg); }
.verdict .h { margin:0; font-size:1.3rem; font-weight:700; text-wrap:balance; } .verdict .c { margin:.25rem 0 0; }
.verdict .h::before { margin-right:.4rem; content:"⊘"; }
.verdict.ok { border-color:var(--ok); background:var(--ok-bg); } .verdict.ok .h { color:var(--ok); } .verdict.ok .h::before { content:"✓"; }
.verdict.warn { border-color:var(--warn); background:var(--warn-bg); } .verdict.warn .h { color:var(--warn); } .verdict.warn .h::before { content:"!"; }
.verdict.fail { border-color:var(--fail); background:var(--fail-bg); } .verdict.fail .h { color:var(--fail); } .verdict.fail .h::before { content:"✕"; }
.age { margin:0 0 .4rem; font-size:.8rem; color:var(--muted); }
.hop { margin:1.1rem 0 .4rem; font-size:.8rem; color:var(--muted); overflow-wrap:anywhere; } .hop code { color:var(--fg); }
.rail { --nd:1.9rem; --ny:2.55rem; list-style:none; margin:.4rem 0 0; padding:0; display:grid; grid-template-columns:repeat(4,1fr); }
.rail li { position:relative; text-align:center; }
.rail li + li::before { content:""; position:absolute; top:var(--ny); left:-50%; width:100%; height:2px; background:var(--faint); }
.rail li.ok + li.ok::before { background:var(--ok); }
.rail .name { display:block; font:600 .75rem var(--mono); color:var(--muted); letter-spacing:.05em; }
.rail .node { position:relative; z-index:1; display:inline-grid; place-items:center; width:var(--nd); height:var(--nd); border-radius:50%; background:var(--bg); border:2px solid var(--faint); color:var(--muted); font-weight:700; }
.rail li.ok .node { border-color:var(--ok); color:var(--ok); background:var(--ok-bg); }
.rail li.warn .node { border-color:var(--warn); color:var(--warn); background:var(--warn-bg); }
.rail li.failed .node { border-color:var(--fail); color:#fff; background:var(--fail); }
.rail li.refused .node { border-color:var(--neutral); color:var(--neutral); background:var(--neutral-bg); }
.rail .ms { display:block; font:.72rem var(--mono); color:var(--muted); min-height:1.1em; }
.busy { margin-top:1.5rem; padding:1rem 1.1rem; border:1px solid var(--line); border-radius:10px; background:var(--neutral-bg); }
h3 { margin:1.6rem 0 .3rem; font-size:.9rem; color:var(--muted); font-weight:600; }
details { border-top:1px solid var(--line); padding:.35rem 0; font-size:.88rem; } summary { cursor:pointer; }
dl { display:grid; grid-template-columns:max-content 1fr; gap:.15rem .9rem; margin:.4rem 0 .4rem .9rem; }
dt { color:var(--muted); } dd { margin:0; overflow-wrap:anywhere; min-width:0; }
.muted { color:var(--muted); font-size:.85rem; }
/* Landing page (hidetzu/connect-doctor#51, candidate C, settled by looking). */
.hero { margin:.2rem 0 .3rem; font-size:1.45rem; line-height:1.35; font-weight:700; }
.hero span { display:inline-block; } /* break between phrases, never inside one */
.hero + .lede { margin:0 0 .9rem; }
.trust { margin:.5rem 0 0; color:var(--muted); font-size:.8rem; }
.trust span + span::before { content:"・"; margin:0 .15em; }
.landing h2 { margin:0 0 .6rem; font-size:.95rem; color:var(--muted); font-weight:600; }
.why { margin:2rem 0 0; } .when, .prose { margin:1.8rem 0 0; }
.cards { display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem; list-style:none; margin:0; padding:0; }
@media (min-width:600px) { .cards { grid-template-columns:repeat(4,1fr); } }
.cards li { padding:.7rem .8rem; border:1px solid var(--line); border-radius:8px; background:var(--panel); }
.cards b { display:block; font:600 .75rem var(--mono); letter-spacing:.05em; color:var(--accent); margin-bottom:.2rem; }
.cards span { font-size:.85rem; line-height:1.5; }
.when ul { margin:0; padding:0; list-style:none; display:grid; gap:.35rem; }
.when li { padding:.45rem .7rem; border-left:3px solid var(--faint); background:var(--panel); font-size:.88rem; border-radius:0 6px 6px 0; }
.prose ul { margin:0; padding-left:1.2rem; } .prose li { margin:.3rem 0; font-size:.92rem; }
.prose pre { margin:.6rem 0 0; padding:.6rem .8rem; overflow-x:auto; background:var(--panel); border:1px solid var(--line); border-radius:6px; font:.85rem var(--mono); }
</style>{{end}}
