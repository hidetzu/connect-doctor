<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} — ConnectDoctor</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="description" content="{{.Lede}}">
{{template "style"}}
<style>
/* /about only: prose on the same tokens. */
.about h2 { margin:1.8rem 0 .4rem; font-size:1.05rem; }
.about ul { margin:0; padding-left:1.2rem; } .about li { margin:.3rem 0; }
.about pre { margin:.6rem 0 0; padding:.6rem .8rem; overflow-x:auto; background:var(--panel); border:1px solid var(--line); border-radius:6px; font:.85rem var(--mono); }
.back { margin:.2rem 0 0; }
.about h1 { font-size:1.4rem; margin:.6rem 0 .2rem; }
</style>
</head>
<body>
<main class="about">
{{template "header" .}}
<h1>{{.Title}}</h1>
<p class="lede">{{.Lede}}</p>
<p class="back"><a href="/">診断ページへ</a></p>
{{range .Sections}}<section>
<h2>{{.Title}}</h2>
<ul>{{range .Items}}<li>{{.}}</li>{{end}}</ul>
{{with .Code}}<pre><code>{{.}}</code></pre>{{end}}
</section>
{{end}}
<footer class="foot">
  <p>{{.Privacy}}</p>
  <p><a href="/">診断ページへ</a></p>
</footer>
</main>
</body>
</html>
